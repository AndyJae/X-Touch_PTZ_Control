[project]
name = "behringer-ptz"
version = "0.1.0"
description = "PTZ shading tool for Behringer X-Touch Extender"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "mido>=1.3.0",
  "python-rtmidi>=1.5.0",
  "httpx>=0.28.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
