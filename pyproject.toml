[project]
name = "ptz-control"
version = "1.0.2"
description = "X-Touch PTZ Control - MIDI-based shading/iris control for PTZ cameras"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "mido>=1.3.0",
  "python-rtmidi>=1.5.0",
  "httpx>=0.28.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.0",
  "pydantic>=2.9.0",
  "PyYAML>=6.0.0",
  "pystray>=0.19.0",
  "Pillow>=11.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
