{% extends "base.html" %}

{% block title %}PTZ Control Logs{% endblock %}
{% block badge %}Logs{% endblock %}

{% block content %}
<section class="panel">
    <div class="panel-header-row">
        <h2>Log Output</h2>
        <label for="log-level" class="visually-hidden">Level</label>
        <select id="log-level" data-log-level-filter>
            {% for level in levels %}
            <option value="{{ level }}" {{ "selected" if level == selected_level else "" }}>{{ level }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="log-list">
        {% for entry in entries %}
        <div class="log-line"><span class="log-time">{{ entry.time }}</span><span class="log-level level-{{ entry.level|lower }}">{{ entry.level }}</span><span class="log-msg">{{ entry.message }}</span></div>
        {% else %}
        <div class="log-line"><span class="log-msg">Keine Log-Eintraege.</span></div>
        {% endfor %}
    </div>
</section>
{% endblock %}
